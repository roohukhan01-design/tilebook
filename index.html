<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1214">
<title>TileBook</title>
<style>
:root{--bg:#f1f8f7;--panel:#ffffff;--ink:#0e1f1d;--sub:#5b7d78;--line:#d3e6e3;--a1:#0d9488;--a2:#f59e0b;--bad:#dc2626;--ok:#16a34a;--soft:#e6f4f2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0a1214;--panel:#11201f;--ink:#e9f7f4;--sub:#8db3ad;--line:#1f3a37;--bad:#f87171;--ok:#4ade80;--soft:#15302d}}
:root[data-theme="dark"]{--bg:#0a1214;--panel:#11201f;--ink:#e9f7f4;--sub:#8db3ad;--line:#1f3a37;--bad:#f87171;--ok:#4ade80;--soft:#15302d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0}

/* splash */
#splash{position:fixed;inset:0;z-index:80;background:radial-gradient(circle at 50% 40%,#0f3d3a,#0a1214 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .6s,transform .6s}
#splash.hide{opacity:0;transform:scale(1.08);pointer-events:none}
.sl{width:112px;height:112px;filter:drop-shadow(0 14px 40px #10b98177)}
.sl .bgr{animation:pop .7s cubic-bezier(.2,1.4,.4,1) both;transform-origin:50% 50%}
.sl .t{transform-box:fill-box;transform-origin:center;opacity:0;animation:tp .5s cubic-bezier(.2,1.5,.4,1) forwards}
.sl .t:nth-of-type(1){animation-delay:.4s}.sl .t:nth-of-type(2){animation-delay:.6s}.sl .t:nth-of-type(3){animation-delay:.8s}.sl .t:nth-of-type(4){animation-delay:1s}
.sn{margin-top:22px;font-size:32px;font-weight:800;letter-spacing:1px;background:linear-gradient(90deg,#99f6e4,#fde68a);-webkit-background-clip:text;background-clip:text;color:transparent;animation:up .7s 1s both}
.st{margin-top:6px;font-size:13px;color:#8db3ad;letter-spacing:3px;animation:up .7s 1.2s both}
.by{margin-top:14px;font-size:12px;color:#5f8a84;letter-spacing:1px;animation:up .7s 1.4s both}
.sb{margin-top:26px;width:150px;height:4px;border-radius:9px;background:#ffffff1c;overflow:hidden}
.sb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#14b8a6,#fbbf24);animation:fill 1.7s .2s forwards}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes tp{from{opacity:0;transform:scale(0) rotate(-30deg)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fill{to{width:100%}}

/* layout */
.app{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
.glow{position:absolute;border-radius:50%;filter:blur(80px);opacity:.28;pointer-events:none;animation:float 14s ease-in-out infinite}
.g1{width:260px;height:260px;background:var(--a1);top:-100px;left:-80px}
.g2{width:220px;height:220px;background:var(--a2);top:60px;right:-100px;animation-delay:-6s}
@keyframes float{50%{transform:translate(30px,30px) scale(1.15)}}
header{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
header svg{width:38px;height:38px;flex:none}
#shopName{font-size:19px;font-weight:800;letter-spacing:.3px}
#dateStr{font-size:12.5px;color:var(--sub)}
#view{flex:1;min-height:0;overflow-y:auto;position:relative;z-index:1;padding:6px 14px 96px;-webkit-overflow-scrolling:touch}
.fade{animation:vin .35s ease}
@keyframes vin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
nav{position:relative;z-index:5;display:flex;background:var(--panel);border-top:1px solid var(--line)}
nav button{flex:1;background:transparent;padding:8px 0 9px;color:var(--sub);font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .25s}
nav button span{font-size:20px;line-height:1.1;transition:transform .3s cubic-bezier(.3,1.6,.4,1)}
nav button.on{color:var(--a1)}nav button.on span{transform:translateY(-2px) scale(1.18)}
#ink{position:absolute;top:0;left:0;width:16.6667%;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--a1),var(--a2));transition:transform .35s cubic-bezier(.3,1.2,.4,1)}
#fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:6;width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--a1),#10b981);color:#fff;font-size:30px;box-shadow:0 10px 26px #0d948877;transition:transform .25s cubic-bezier(.3,1.6,.4,1),opacity .2s}
#fab:active{transform:scale(.9)}#fab.off{transform:scale(0);opacity:0;pointer-events:none}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}
.card h3,h3.t{margin:0 0 8px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--sub)}
h3.t{margin:18px 4px 6px}
.hero{background:linear-gradient(135deg,#0d9488,#059669 60%,#d97706);color:#fff;border:0;box-shadow:0 14px 34px #0d948844;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:#ffffff1a}
.hero .lbl{font-size:13px;opacity:.85}
.hero .big{font-size:38px;font-weight:800;margin:4px 0 2px;letter-spacing:.5px}
.hero .sub{font-size:14px;opacity:.9}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .card{margin:0}
.k{font-size:12px;color:var(--sub)}.v{font-size:20px;font-weight:800;margin-top:2px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.note{font-size:12.5px;color:var(--sub);margin-top:6px;line-height:1.4}
.chart{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:6px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10.5px;color:var(--sub)}
.bar i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--a2),var(--a1));min-height:3px;transform-origin:bottom;animation:grow .7s cubic-bezier(.3,1.2,.4,1) both}
.bar.today i{box-shadow:0 0 14px #14b8a688}
@keyframes grow{from{transform:scaleY(0)}}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .l{min-width:0}.row .l b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .l small{color:var(--sub);font-size:12px}
.row .r{text-align:right;font-weight:700;font-size:14px;white-space:nowrap}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#f59e0b22;color:var(--a2);margin-left:6px;vertical-align:middle}
.badge.out{background:#ef444422;color:var(--bad)}
.empty{text-align:center;color:var(--sub);padding:26px 10px;line-height:1.5}
.empty b{font-size:34px;display:block}

/* stock */
.search{width:100%;padding:13px 15px;border-radius:14px;border:1px solid var(--line);background:var(--panel);margin:8px 0 4px;outline:0}
.search:focus,input:focus,select:focus,textarea:focus{border-color:var(--a1);box-shadow:0 0 0 3px #14b8a633}
.item{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0;width:100%;text-align:left;transition:transform .15s;animation:vin .35s both}
.item:active{transform:scale(.98)}
.chip{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--a1),#10b981);display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;flex:none}
.item .m{flex:1;min-width:0}.item .m b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m small{color:var(--sub);font-size:12.5px}
.item .q{text-align:right;font-weight:800;font-size:16px;white-space:nowrap}.item .q small{display:block;font-weight:500;color:var(--sub);font-size:11.5px}

/* forms */
label{display:block;font-size:12.5px;color:var(--sub);font-weight:600;margin:10px 0 0}
input,select,textarea{width:100%;margin-top:5px;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);outline:0;font-size:15px}
textarea{min-height:90px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{padding:13px 16px;border-radius:13px;background:var(--soft);color:var(--ink);font-weight:700;transition:transform .15s}
.btn:active{transform:scale(.95)}
.btn.pri{background:linear-gradient(135deg,var(--a1),#10b981);color:#fff;box-shadow:0 8px 20px #0d948844}
.btn.dng{background:#ef444422;color:var(--bad)}
.btn.big{width:100%;margin-top:12px;font-size:16px;padding:15px}
.btns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.btns .btn{flex:1;min-width:90px}
.prev{margin-top:12px;padding:12px;border-radius:13px;background:var(--soft);font-weight:700;text-align:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.chips button{flex:none;padding:9px 16px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--sub);font-weight:600;transition:all .25s}
.chips button.on{background:linear-gradient(135deg,var(--a1),#10b981);color:#fff;border-color:transparent}

/* sheet */
#sw{position:fixed;inset:0;z-index:40;background:#0008;display:none;align-items:flex-end;justify-content:center}
#sw.on{display:flex;animation:fi .25s}
@keyframes fi{from{opacity:0}}
#sheet{width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:var(--panel);border-radius:26px 26px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:su .35s cubic-bezier(.2,1,.3,1)}
@keyframes su{from{transform:translateY(100%)}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
#sheet h2{margin:4px 0 4px;font-size:20px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#0f2a27;color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.3,1.3,.4,1);z-index:90;box-shadow:0 10px 30px #0006;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
a.btn{text-decoration:none;display:inline-block;text-align:center}
input[type=checkbox]{width:auto;margin:0 10px 0 0;accent-color:var(--a1);transform:scale(1.3)}
label.chk{display:flex;align-items:center;font-size:14px;color:var(--ink);margin-top:14px;font-weight:500}
.brow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.brow .am{margin-left:auto;font-weight:700;white-space:nowrap}
.brow .x{background:#ef444422;color:var(--bad);border-radius:9px;width:30px;height:30px;flex:none}
.rcpt{background:#fff;color:#111;border-radius:12px;padding:18px 16px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;box-shadow:0 6px 24px #0003;margin:10px 0}
.rcpt .rh{text-align:center;margin-bottom:6px}.rcpt .rh b{display:block;font-size:18px;letter-spacing:1px}.rcpt .rh small{display:block;color:#555;font-size:11.5px}
.rcpt .rt{text-align:center;font-weight:700;letter-spacing:3px;margin:8px 0}
.rcpt .rl{border-top:1px dashed #888;margin:9px 0}
.rcpt .ri,.rcpt .rr{display:flex;justify-content:space-between;gap:10px}.rcpt .ri small{display:block;color:#555}
.rcpt .rr.big{font-weight:800;font-size:15px}
.rcpt .rf{text-align:center;margin-top:12px;color:#444}
.cdisp{font-size:44px;font-weight:800;text-align:right;padding:2px 6px;overflow:hidden;white-space:nowrap}
.cexpr{text-align:right;color:var(--sub);font-size:14px;min-height:20px;padding:0 6px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:10px}
.key{height:58px;border-radius:17px;background:var(--soft);font-size:21px;font-weight:700;transition:transform .12s,background .2s}
.key:active{transform:scale(.9)}.key.op{background:#f59e0b22;color:var(--a2)}.key.fn{color:var(--a1)}
.key.eq{background:linear-gradient(135deg,var(--a1),#10b981);color:#fff}
.res{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--soft)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px}.kv b{text-align:right}
input[type=range]{padding:0;height:34px;accent-color:var(--a1);border:0;background:transparent}
.about{position:relative;border-radius:24px;padding:2px;overflow:hidden;margin:10px 0;box-shadow:0 14px 40px #8b5cf633}
.about:before{content:"";position:absolute;inset:-70%;background:conic-gradient(from 0deg,#14b8a6,#8b5cf6,#f59e0b,#ec4899,#14b8a6);animation:spin 7s linear infinite}
.about .in{position:relative;background:var(--panel);border-radius:22px;padding:18px;overflow:hidden}
#neural{position:absolute;inset:0;width:100%;height:100%;opacity:.55;pointer-events:none}
.about .in>*:not(canvas){position:relative}
.ab2{display:flex;align-items:center;gap:16px}
.orb{width:74px;height:74px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:800;color:#fff;background:radial-gradient(circle at 30% 28%,#fff,#5eead4 22%,#8b5cf6 62%,#0d9488);box-shadow:0 0 34px #8b5cf699;animation:breathe 3.2s ease-in-out infinite;position:relative}
.orb:before,.orb:after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #8b5cf6;animation:ring 2.6s ease-out infinite}
.orb:after{animation-delay:1.3s}
.sys{font:11px ui-monospace,Menlo,monospace;letter-spacing:2px;color:var(--sub)}
.shim{font-size:32px;font-weight:800;line-height:1.1;background:linear-gradient(90deg,#14b8a6,#8b5cf6,#f59e0b,#14b8a6);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 4s linear infinite}
.type{display:inline-block;overflow:hidden;white-space:nowrap;border-right:2px solid var(--a2);width:0;font:12.5px ui-monospace,Menlo,monospace;color:var(--ink);animation:typing 2.4s steps(27) .4s forwards,blink .8s step-end infinite}
.stat{display:flex;align-items:center;gap:9px;font:12px ui-monospace,Menlo,monospace;padding:5px 0;color:var(--sub)}
.stat i{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 10px #22c55e;animation:pulse2 2s infinite}
.stat i.off{background:#94a3b8;box-shadow:none;animation:none}
.stat b{margin-left:auto;color:var(--ink);letter-spacing:1px;font-weight:600}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.07)}}
@keyframes ring{from{transform:scale(1);opacity:.7}to{transform:scale(1.6);opacity:0}}
@keyframes shim{to{background-position:300% 0}}
@keyframes typing{to{width:27ch}}
@keyframes blink{50%{border-color:transparent}}
@keyframes pulse2{50%{opacity:.35}}
.ab{display:flex;align-items:center;gap:12px;padding:4px 0 10px}
.av{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800;flex:none}
.ab b{display:block;font-size:17px}.ab small{color:var(--sub);font-size:12.5px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01s !important;animation-delay:0s !important;transition-duration:.01s !important}}
</style>
</head>
<body>

<div id="splash">
  <svg class="sl" viewBox="0 0 100 100">
    <defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d9488"/><stop offset="1" stop-color="#10b981"/></linearGradient></defs>
    <rect class="bgr" width="100" height="100" rx="24" fill="url(#tg)"/>
    <rect class="t" x="21" y="21" width="27" height="27" rx="6" fill="#fff"/>
    <rect class="t" x="52" y="21" width="27" height="27" rx="6" fill="#e6f7f4"/>
    <rect class="t" x="21" y="52" width="27" height="27" rx="6" fill="#e6f7f4"/>
    <rect class="t" x="52" y="52" width="27" height="27" rx="6" fill="#fbbf24"/>
  </svg>
  <div class="sn">TileBook</div>
  <div class="st">STOCK · SALES · PROFIT</div>
  <div class="by">by Roohu</div>
  <div class="sb"><i></i></div>
</div>

<div class="app">
  <div class="glow g1"></div><div class="glow g2"></div>
  <header>
    <svg viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="url(#tg)"/><rect x="21" y="21" width="27" height="27" rx="6" fill="#fff"/><rect x="52" y="21" width="27" height="27" rx="6" fill="#e6f7f4"/><rect x="21" y="52" width="27" height="27" rx="6" fill="#e6f7f4"/><rect x="52" y="52" width="27" height="27" rx="6" fill="#fbbf24"/></svg>
    <div><div id="shopName"></div><div id="dateStr"></div></div>
  </header>
  <div id="view"></div>
  <button id="fab" data-act="newItem" aria-label="Add tile">+</button>
  <nav>
    <button data-v="home"><span>🏠</span>Home</button>
    <button data-v="stock"><span>📦</span>Stock</button>
    <button data-v="sell"><span>💰</span>Sell</button>
    <button data-v="tools"><span>🧰</span>Tools</button>
    <button data-v="reports"><span>📊</span>Reports</button>
    <button data-v="more"><span>⚙️</span>More</button>
    <i id="ink"></i>
  </nav>
</div>
<div id="sw"><div id="sheet"></div></div>
<div id="toast"></div>

<script>
var KEY='tilebook_v1',DAY=864e5,VIEWS=['home','stock','sell','tools','reports','more'];
var D={shop:'My Tile Shop',cur:'',unit:'m²',items:[],sales:[],dues:[],snd:true,vol:.6,style:'pro',bills:[],billSeq:0,addr:'',sphone:''};
var view='home',rng='7',q='',tool='calc';
var C={cur:'0',prev:null,op:null,fresh:false,expr:''};
var $=function(s){return document.querySelector(s)};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function r2(n){return Math.round(n*100)/100}
function fmt(n){return (+n).toLocaleString(undefined,{maximumFractionDigits:2})}
function money(n){return (D.cur?D.cur+' ':'')+fmt(n)}
function qs(n){return fmt(n)+' '+D.unit}
function num(v){var n=parseFloat(v);return isFinite(n)&&n>0?n:0}
function sod(t){var d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
function label(it){return [it.name,it.color,it.design].filter(Boolean).join(' · ')}
function find(id){for(var i=0;i<D.items.length;i++)if(D.items[i].id===id)return D.items[i]}

function load(){try{var d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&typeof d==='object'){D.shop=d.shop||D.shop;D.cur=d.cur||'';D.unit=d.unit||D.unit;D.items=Array.isArray(d.items)?d.items:[];D.sales=Array.isArray(d.sales)?d.sales:[];D.dues=Array.isArray(d.dues)?d.dues:[];if(typeof d.snd==='boolean')D.snd=d.snd;if(d.style==='fun')D.style='fun';D.bills=Array.isArray(d.bills)?d.bills:[];D.billSeq=+d.billSeq||0;D.addr=d.addr||'';D.sphone=d.sphone||'';if(typeof d.vol==='number')D.vol=Math.max(0,Math.min(1,d.vol))}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
/* sound: soft bell notes made on the phone, no files needed */
var AC=null,master=null,tapI=0;
var SC=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.51,1567.98,1760];
function ac(){
  if(!D.snd)return null;
  try{
    if(!AC){
      AC=new (window.AudioContext||window.webkitAudioContext)();
      master=AC.createGain();var dl=AC.createDelay(),fb=AC.createGain(),wet=AC.createGain();
      dl.delayTime.value=.19;fb.gain.value=.3;wet.gain.value=.3;
      master.connect(AC.destination);master.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(AC.destination);
    }
    if(AC.state==='suspended')AC.resume();
    master.gain.value=D.vol;return AC;
  }catch(e){return null}
}
function note(f,t,d,g,type){
  var c=ac();if(!c)return;
  try{

function stats(from,to){
  var s={rev:0,cost:0,qty:0,n:0};
  D.sales.forEach(function(x){if(x.ts>=from&&x.ts<(to||Infinity)){s.rev+=x.q*x.p;s.cost+=x.q*x.c;s.qty+=x.q;s.n++}});
  s.profit=s.rev-s.cost;return s;
}
function forecast(t0){
  if(!D.sales.length)return null;
  var first=sod(Math.min.apply(null,D.sales.map(function(x){return x.ts})));
  var days=Math.min(30,Math.floor((t0-first)/DAY)+1);
  var s=stats(t0-(days-1)*DAY);
  return{days:days,rev:s.rev/days*30,profit:s.profit/days*30};
}
function byItem(from,to){
  var m={};
  D.sales.forEach(function(x){
    if(x.ts>=from&&x.ts<(to||Infinity)){
      var o=m[x.name]||(m[x.name]={name:x.name,qty:0,rev:0,profit:0});
      o.qty+=x.q;o.rev+=x.q*x.p;o.profit+=x.q*(x.p-x.c);
    }
  });
  return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return b.rev-a.rev});
}

function calcKey(k){
  if(C.cur==='Error'&&k!=='C')C.cur='0';
  if(/^[0-9]$/.test(k)){if(C.fresh||C.cur==='0'){C.cur=k;C.fresh=false}else if(C.cur.length<14)C.cur+=k}
  else if(k==='.'){if(C.fresh){C.cur='0.';C.fresh=false}else if(C.cur.indexOf('.')<0)C.cur+='.'}
  else if(k==='C'){C={cur:'0',prev:null,op:null,fresh:false,expr:''}}
  else if(k==='⌫'){if(!C.fresh)C.cur=C.cur.length>1?C.cur.slice(0,-1):'0'}
  else if(k==='%'){C.cur=cstr(+C.cur/100)}
  else if(k==='±'){C.cur=C.cur.charAt(0)==='-'?C.cur.slice(1):(C.cur==='0'?'0':'-'+C.cur)}
  else if(k==='='){if(C.op&&C.prev!==null){var r=cstr(cdo(C.prev,C.op,C.cur));C.expr=C.prev+' '+C.op+' '+C.cur+' =';C.cur=r;C.prev=null;C.op=null;C.fresh=true}}
  else{
    if(C.op&&C.prev!==null&&!C.fresh)C.cur=cstr(cdo(C.prev,C.op,C.cur));
    C.prev=C.cur;C.op=k;C.fresh=true;C.expr=C.prev+' '+k;
  }
  calcShow();
}

  shareBill:function(b){
    var x=findBill(b.dataset.id);if(!x)return;var t=billText(x),done=false;
    try{if(navigator.share){navigator.share({title:'Bill '+x.no,text:t}).catch(function(){});done=true}}catch(e){}
    if(!done)toast(copyText(t)?'Bill copied. Paste it in WhatsApp ✓':'Copy failed');
  },
  cancelBill:function(b){twice(b,function(){
    var x=findBill(b.dataset.id);if(!x)return;
    x.items.forEach(function(i){var it=find(i.itemId);if(it)it.stock=r2(it.stock+i.q)});
    D.sales=D.sales.filter(function(s){return s.billId!==x.id});
    if(x.dueRef){var c=cust(x.dueRef.cid);if(c)c.entries=c.entries.filter(function(e){return e.id!==x.dueRef.eid})}
    D.bills=D.bills.filter(function(y){return y!==x});save();closeSheet();render();toast('Bill cancelled, stock returned','del');
  })},
  copyBackup:function(){toast(copyText(JSON.stringify(D))?'Backup copied ✓':'Copy failed')},
  restore:function(b){
    try{
      var d=JSON.parse($('#m_restore').value.trim());
      if(!d||!Array.isArray(d.items)||!Array.isArray(d.sales))throw 0;
      twice(b,function(){D.shop=d.shop||D.shop;D.cur=d.cur||'';D.unit=d.unit||'m²';D.items=d.items;D.sales=d.sales;D.dues=Array.isArray(d.dues)?d.dues:[];D.bills=Array.isArray(d.bills)?d.bills:[];D.billSeq=+d.billSeq||0;D.addr=d.addr||'';D.sphone=d.sphone||'';save();render();toast('Restored ✓')});
    }catch(e){err('This backup is not correct')}
  },
  wipe:function(b){twice(b,function(){D={shop:'My Tile Shop',cur:'',unit:'m²',items:[],sales:[],dues:[],snd:D.snd,vol:D.vol,style:D.style,bills:[],billSeq:0,addr:'',sphone:''};save();render();toast('All data deleted','del')})}
};
document.addEventListener('click',function(e){
  var n=e.target.closest('nav button');if(n){SND.nav(VIEWS.indexOf(n.dataset.v));go(n.dataset.v);return}
  var sb=e.target.closest('button,a.btn');if(sb&&!sb.dataset.nosnd)SND.tap();
  if(e.target.id==='sw'){closeSheet();return}
  var b=e.target.closest('[data-act]');if(b&&A[b.dataset.act])A[b.dataset.act](b,e);
});
function prev(){
  var it=find($('#s_item').value),n=num($('#s_q').value),p=num($('#s_p').value),el=$('#s_prev');if(!el)return;
  if(!n||!p){el.textContent='Total: —';return}
  el.textContent='Total: '+money(n*p)+(it?'  ·  Profit: '+money(n*(p-it.cost)):'');
}
document.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='search'){q=e.target.value;$('#slist').innerHTML=stockList()}
  else if(id==='s_q'||id==='s_p')prev();
  else if(/^e_/.test(id))estCalc();
  else if(/^d_/.test(id))discCalc();
  else if(/^g_/.test(id))marginCalc();
  else if(id==='m_vol'){D.vol=(+e.target.value)/100;save();if(master)master.gain.value=D.vol}
  else if(id==='m_shop'){D.shop=e.target.value;save();$('#shopName').textContent=D.shop||'TileBook'}
  else if(id==='m_cur'){D.cur=e.target.value.trim();save()}
  else if(id==='m_unit'){D.unit=e.target.value.trim()||'m²';save()}
  else if(id==='m_addr'){D.addr=e.target.value;save()}
  else if(id==='m_sphone'){D.sphone=e.target.value;save()}
  else if(BD&&id==='b_cust'){BD.cust=e.target.value}
  else if(BD&&id==='b_phone'){BD.phone=e.target.value}
  else if(BD&&(id==='b_disc'||id==='b_paid')){BD[id==='b_disc'?'disc':'paid']=e.target.value;var bt=$('#b_tot');if(bt)bt.innerHTML=billTotHtml()}
});
document.addEventListener('change',function(e){
  if(e.target.id==='s_item'){var it=find(e.target.value);if(it){$('#s_p').value=it.price||''}prev()}
  if(e.target.id==='e_item'){var t=find(e.target.value);if(t){$('#e_price').value=t.price||''}estCalc()}
  if(e.target.id==='m_vol')SND.tap();
  if(BD&&e.target.id==='b_item'){var bi=find(e.target.value);if(bi){$('#b_p').value=bi.price||''}}
  if(BD&&e.target.id==='b_dues')BD.dues=e.target.checked;
});

load();go('home');
setTimeout(function(){try{SND.welcome()}catch(e){}},900);
setTimeout(function(){var s=$('#splash');s.classList.add('hide');setTimeout(function(){s.style.display='none'},700)},2200);
</script>
</body>
